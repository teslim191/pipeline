version: 0.2

phases:
  install:
    commands:
      - echo Installing Node.js and npm...
      - curl -o nodejs.msi https://nodejs.org/dist/v16.17.0/node-v16.17.0-x64.msi
      - msiexec.exe /i nodejs.msi /quiet /norestart
      - echo Verifying installation...
      - node -v
      - npm -v
      - echo Installing project dependencies...
      - npm install
  pre_build:
    commands:
      - echo Preparing for build...
  build:
    commands:
      - echo Building the project...
      - npm run build # Or any other build script you have
  post_build:
    commands:
      - echo Build completed successfully
      - zip -r output.zip ./ # Adjust if needed to specify only certain files or directories

artifacts:
  files:
    - output.zip
  discard-paths: yes
